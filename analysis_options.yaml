# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - always_declare_return_types: true          # Explicitly declare return types for functions
    - annotate_overrides: true                   # Annotate overridden members with @override
    - avoid_init_to_null: true                   # Avoid redundant explicit initialization to null
    - avoid_print: true                          # Avoid using print in production code
    - prefer_const_constructors: true            # Prefer const constructors where possible
    - prefer_const_declarations: true            # Prefer const declarations for immutable variables
    - prefer_const_literals_to_create_immutables: true # Prefer const literals for immutable collections
    - prefer_is_empty: true                      # Prefer isEmpty for checking empty collections
    - prefer_is_not_empty: true                  # Prefer isNotEmpty instead of negation
    - prefer_relative_imports: true              # Prefer relative imports for local files
    - prefer_single_quotes: true                 # Prefer single quotes for string literals
    - sized_box_for_whitespace: true             # Use SizedBox instead of Container for spacing
    - sort_child_properties_last: true           # Sort child/children properties at the end
    - unnecessary_const: true                    # Avoid unnecessary const keywords
    - unnecessary_new: true                      # Avoid unnecessary new keywords
    - unnecessary_string_interpolations: true    # Avoid unnecessary string interpolations